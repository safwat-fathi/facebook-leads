# HTTP-only bootstrap; `sudo certbot --nginx -d <domain>` adds the 443 block and the redirect.
# Replace leads.example.com with your domain (the A record must point at the VPS), then:
#   sudo cp deploy/leads.conf /etc/nginx/sites-available/leads && sudo ln -s /etc/nginx/sites-available/leads /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d leads.example.com
#
# X-Forwarded-For must OVERWRITE with $remote_addr (never $proxy_add_x_forwarded_for): the app throttles login per client IP and
# trusts this header. If the domain is behind Cloudflare, the box needs real_ip handling at http{} level (see now-focus
# deploy/cloudflare-realip.sh), otherwise every visitor looks like one Cloudflare edge IP.
server {
    listen 80;
    listen [::]:80;
    server_name leads.example.com;

    server_tokens off;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
