# HTTP-only bootstrap; `sudo certbot --nginx -d fbleads.tijaratk.com` adds the 443 block and the redirect.
# fbleads.tijaratk.com: Cloudflare A record (proxied) -> the VPS. Then:
#   sudo cp deploy/leads.conf /etc/nginx/sites-available/leads && sudo ln -s /etc/nginx/sites-available/leads /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d fbleads.tijaratk.com
#
# X-Forwarded-For must OVERWRITE with $remote_addr (never $proxy_add_x_forwarded_for): the app throttles login per client IP and
# trusts this header. The record is proxied by Cloudflare, so nginx needs real_ip handling at http{} level or every visitor looks like
# one Cloudflare edge IP (the now-focus box already has it globally; check `grep -rn real_ip /etc/nginx`, and see now-focus
# services/api/deploy/cloudflare-realip.sh only if that finds nothing: a duplicate makes `nginx -t` fail).
server {
    listen 80;
    listen [::]:80;
    server_name fbleads.tijaratk.com;

    server_tokens off;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
